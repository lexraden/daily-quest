<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f9fafb" id="theme-color-meta" />
    <script>
      // Correct the theme colour during parsing, before any module loads.
      // Chrome reads theme-color very early, and an installed app may never
      // look again — so the first value it sees has to be the right one.
      try {
        if (localStorage.getItem('dailyQuestsTheme') === 'dark') {
          document.getElementById('theme-color-meta').content = '#0f1419';
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (e) {
        /* storage unavailable — the light default stands */
      }
    </script>
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <title>Daily Quests</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
