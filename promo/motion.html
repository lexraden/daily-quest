<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440, height=1440">
<title>DailyQ Promo Motion</title>
<style>
@font-face { font-family: "Geist"; src: url("fonts/Geist-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; }
@font-face { font-family: "Geist"; src: url("fonts/Geist-Medium.woff2") format("woff2"); font-weight: 500; font-style: normal; }
@font-face { font-family: "Geist"; src: url("fonts/Geist-SemiBold.woff2") format("woff2"); font-weight: 600; font-style: normal; }

html, body { margin: 0; padding: 0; background: #ECEAE6; }
#stage {
  position: relative; width: 1440px; height: 1440px; overflow: hidden;
  background: #ECEAE6; font-family: "Geist", sans-serif; color: #0B0B0C;
  -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
}
#cam { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
#shape { position: absolute; overflow: hidden; transform-origin: 50% 50%; }
#inner { position: absolute; width: 0; height: 0; }
.c { position: absolute; display: none; transform-origin: 50% 50%; }
.abs { position: absolute; }
.flex { display: flex; align-items: center; }
.center { justify-content: center; }
.tnum { font-variant-numeric: tabular-nums; }
.gray { color: #8A8782; }
.vio { color: #7C5CFA; }
.w { color: #FFFFFF; }
svg { display: block; overflow: visible; }
.roll { display: inline-block; overflow: visible; vertical-align: top; }
.roll > span { display: block; }
.roll > span > span { display: block; text-align: center; }
#cursor { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="cam">
    <div id="shape"><div id="inner"></div></div>
  </div>
  <div id="cursor">
    <svg width="60" height="60" viewBox="0 0 24 24" style="position:absolute;left:-12.5px;top:-7.5px;filter:drop-shadow(0 1.5px 2.5px rgba(11,11,12,.22))">
      <path d="M5 3 L5 19.2 L9.2 15.4 L12 21.4 L14.7 20.2 L11.9 14.3 L17.5 14.1 Z" fill="#0B0B0C" stroke="#FFFFFF" stroke-width="1.35" stroke-linejoin="round"/>
    </svg>
  </div>
</div>
<script>
(() => {
'use strict';
/* =========================================================================
   DailyQ promo: every frame is a pure function of t.
   ========================================================================= */
const D = 14;
window.DURATION = D;
window.FPS = 60;

const INK = [11, 11, 12], WH = [255, 255, 255], VI = [124, 92, 250], G2 = [138, 135, 130];
const OFF = [228, 225, 220], DIM = [214, 210, 204], BOX = [205, 201, 195];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const mix = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
const rgb = c => `rgb(${Math.round(clamp(c[0], 0, 255))},${Math.round(clamp(c[1], 0, 255))},${Math.round(clamp(c[2], 0, 255))})`;
const easeOut = x => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
const easeInOut = x => { x = clamp(x, 0, 1); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const px = v => `${v.toFixed(3)}px`;

/* ---- springs: closed-form step response of an underdamped 2nd-order system ---- */
function spring(tau, w, z) {
  if (tau <= 0) return 0;
  const wd = w * Math.sqrt(1 - z * z);
  const e = Math.exp(-z * w * tau);
  return 1 - e * (Math.cos(wd * tau) + (z * w / wd) * Math.sin(wd * tau));
}
const P = {
  morph: [21, 0.8],  cam:  [12, 0.92],  curx: [13.5, 0.86], cury: [12, 0.86],
  drag:  [8.5, 0.9], lead: [34, 0.8],  trail: [15, 0.88],  fast: [70, 0.9],
  snap:  [21, 0.78], grow: [13, 0.84],  roll: [22, 0.86],   soft: [11, 0.9],
  pop:   [26, 0.82],
};
const sp = (tau, p) => spring(tau, p[0], p[1]);

/* A value whose target changes many times = sum of one spring per change.
   Periodic over D: each change also contributes its copy from the previous loop,
   so the value (and its velocity) at t=14 equals t=0 exactly. */
function track(t, ev, p) {
  const n = ev.length;
  let v = ev[n - 1][1];
  for (let i = 0; i < n; i++) {
    const d = ev[i][1] - ev[(i + n - 1) % n][1];
    if (d === 0) continue;
    const pp = ev[i][2] || p;
    v += d * (sp(t - ev[i][0], pp) + sp(t + D - ev[i][0], pp) - 2);
  }
  return v;
}
/* press pulse: 0 -> ~1 landing on tc, back to 0 */
const press = (t, tc) => sp(t - (tc - 0.06), P.fast) - sp(t - (tc + 0.05), P.fast);
const hold = (t, a, b) => sp(t - (a - 0.06), P.fast) - sp(t - b, P.fast);
/* short fades for content: in = blur->sharp, out = blur+fade */
const fin = (t, t0, dur = 0.16) => easeOut((t - t0) / dur);
const fout = (t, t1, dur = 0.12) => easeOut((t - t1) / dur);

/* ---- icons: 24-unit grid, stroke is always 1.75 world px, round caps ---- */
const IC = {
  arrow: '<path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
  mic: '<rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M18.5 11a6.5 6.5 0 0 1-13 0"/><path d="M12 17.5V21"/>',
  bell: '<path d="M6 8.5a6 6 0 0 1 12 0c0 6.5 2.5 8.5 2.5 8.5h-17S6 15 6 8.5z"/><path d="M10.2 20.5a2 2 0 0 0 3.6 0"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/>',
  plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
  meal: '<path d="M4 3v6.5a2.5 2.5 0 0 0 2.5 2.5h1A2.5 2.5 0 0 0 10 9.5V3"/><path d="M7 3v18"/><path d="M19.5 15V3c-2.5 0-4.5 2.3-4.5 5.5V15h4.5zm0 0v6"/>',
  chart: '<path d="M4 4v16h16"/><path d="M9 16v-4"/><path d="M13.5 16V8"/><path d="M18 16v-6"/>',
  inbox: '<path d="M21.5 12.5h-5.5l-2 3h-4l-2-3H2.5"/><path d="M5.6 5.1L2.5 12.5V18a2 2 0 0 0 2 2h15a2 2 0 0 0 2-2v-5.5l-3.1-7.4A2 2 0 0 0 16.6 4H7.4a2 2 0 0 0-1.8 1.1z"/>',
  dcheck: '<path d="M2 12.5l4.5 4.5L16 7.5"/><path d="M12.5 16l1 1 9.5-9.5"/>',
  cmd: '<path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3z"/>',
  enter: '<path d="M20 5v6a4 4 0 0 1-4 4H4.5"/><path d="M9 10l-5 5 5 5"/>',
};
function icon(name, size, color, extra = '') {
  const sw = (1.75 * 24 / size).toFixed(4);
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" ${extra}>${IC[name]}</svg>`;
}
/* a check that draws itself: pathLength=1, dashoffset animated */
function drawCheck(id, size, color) {
  const sw = (1.75 * 24 / size).toFixed(4);
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"><path id="${id}" d="M5 12.5l4.5 4.5L19 7.5" pathLength="1" stroke-dasharray="1 2" stroke-dashoffset="1"/></svg>`;
}
function setRoll(col, v, h) {
  col.style.transform = `translateY(${px(-h * v)})`;
  const kids = col.children;
  for (let i = 0; i < kids.length; i++) {
    const d = Math.abs(i - v);
    const o = clamp(1 - d * 1.35, 0, 1);
    kids[i].style.opacity = o.toFixed(4);
    kids[i].style.filter = o > 0 && d > 0.02 ? `blur(${px(Math.min(d, 1) * 3)})` : 'none';
  }
}
const roll = (id, digits, h, extraCls = '') =>
  `<span class="roll ${extraCls}" style="height:${h}px;line-height:${h}px"><span id="${id}">${digits.map(d => `<span style="height:${h}px">${d}</span>`).join('')}</span></span>`;

/* =========================================================================
   The one shape: its targets on the beat grid (world px, centre origin).
   ========================================================================= */
const KF = [
  { t: 0.50,  id: 'loader',  w: 64,  h: 64,  r: 32, c: INK, s: 4.2 },
  { t: 1.00,  id: 'check',   w: 64,  h: 64,  r: 32, c: VI,  s: 4.2 },
  { t: 1.50,  id: 'xp',      w: 148, h: 60,  r: 30, c: VI },
  { t: 2.00,  id: 'island',  w: 236, h: 52,  r: 26, c: INK },
  { t: 2.50,  id: 'quest',   w: 360, h: 108, r: 24, c: WH },
  { t: 3.50,  id: 'xpbar',   w: 400, h: 92,  r: 22, c: WH },
  { t: 4.00,  id: 'mic',     w: 88,  h: 88,  r: 44, c: INK, s: 3.9 },
  { t: 4.50,  id: 'rec',     w: 288, h: 72,  r: 36, c: INK },
  { t: 5.50,  id: 'chip',    w: 320, h: 60,  r: 30, c: WH },
  { t: 6.00,  id: 'meal',    w: 400, h: 256, r: 28, c: WH },
  { t: 7.75,  id: 'toggle',  w: 340, h: 84,  r: 42, c: WH },
  { t: 8.50,  id: 'tabs',    w: 372, h: 64,  r: 32, c: WH },
  { t: 9.50,  id: 'chart',   w: 396, h: 420, r: 32, c: WH, y: 166, s: 1.9 },
  { t: 10.50, id: 'push',    w: 420, h: 92,  r: 26, c: WH },
  { t: 11.00, id: 'tg',      w: 340, h: 92,  r: [24, 24, 24, 8], c: WH },
  { t: 11.50, id: 'email',   w: 440, h: 104, r: 20, c: WH },
  { t: 12.00, id: 'palette', w: 440, h: 272, r: 24, c: WH },
  { t: 12.50, id: null,      w: 440, h: 176, r: 24, c: WH, y: -48 },
  { t: 12.62, id: null,      w: 440, h: 128, r: 24, c: WH, y: -72 },
  { t: 13.00, id: 'toast',   w: 232, h: 60,  r: 30, c: INK },
  { t: 13.50, id: 'button',  w: 296, h: 64,  r: 32, c: INK },
];
KF.forEach(k => {
  k.x = k.x || 0; k.y = k.y || 0;
  k.rr = Array.isArray(k.r) ? k.r : [k.r, k.r, k.r, k.r];
  if (!k.s) k.s = clamp(Math.min(880 / k.w, 680 / k.h), 1.3, 3.2);
});
const evOf = f => KF.map(k => [k.t, f(k)]);
const EV = {
  w: evOf(k => k.w), h: evOf(k => k.h), x: evOf(k => k.x), y: evOf(k => k.y),
  r: [0, 1, 2, 3].map(i => evOf(k => k.rr[i])),
  c: [0, 1, 2].map(i => evOf(k => k.c[i])),
};
/* camera: follows the shape, small states zoom in, wide states pull out */
const CAM = KF.map(k => ({ t: k.t, x: k.x, y: k.y, s: k.s }));
CAM.push({ t: 10.0, x: -24, y: 150, s: 2.1 });   // lean into the tooltip
CAM.sort((a, b) => a.t - b.t);
const CEV = { x: CAM.map(c => [c.t, c.x]), y: CAM.map(c => [c.t, c.y]), s: CAM.map(c => [c.t, Math.log(c.s)]) };

/* ---- slider geometry (meal card) ---- */
const SL = { L: -164, R: 164, y: 86, pMin: 0.5, pMax: 2 };
const slX = p => SL.L + (p - SL.pMin) / (SL.pMax - SL.pMin) * (SL.R - SL.L);
const X1 = slX(1), X2 = slX(2);

/* ---- cursor: world-space targets, moved by springs (x and y differ a touch, so paths curve) ---- */
const CUR = [
  [0.12, 50, 10],         // onto the button
  [0.70, 98, 66],         // drift off while it loads
  [2.44, -144, 3],        // to the checkbox
  [3.18, 44, 72],
  [4.06, 5, 6],           // mic
  [4.92, 108, 4],         // stop
  [5.70, 112, 70],
  [6.56, X1, SL.y],       // grab the knob
  [7.00, 226, SL.y + 4, P.drag], // drag past max
  [7.56, 108, 5],         // to the switch
  [8.56, 3, 6],           // Week
  [9.56, -42, 262],       // hover Wed
  [10.52, 238, 150],      // rest while reminders arrive
  [12.90, 176, 110],
  [13.50, 124, 88],       // beat-0 spot
];
const CEVx = CUR.map(c => [c[0], c[1], c[3] || P.curx]);
const CEVy = CUR.map(c => [c[0], c[2], c[3] || P.cury]);
const curX = t => track(t, CEVx, P.curx);
const curY = t => track(t, CEVy, P.cury);
const CLICKS = [0.5, 3.0, 4.5, 5.5, 8.0, 9.0];
const cursorPress = t => CLICKS.reduce((a, c) => a + press(t, c), 0) + hold(t, 7.0, 7.5);

/* ---- slider is direct manipulation while held, springs home on release ---- */
const rubber = (o, d = 18) => d * o / (d + o);
function dragDisplay(t) {
  const raw = X1 + (curX(t) - curX(7.0));
  if (raw > X2) return X2 + rubber(raw - X2);
  if (raw < SL.L) return SL.L - rubber(SL.L - raw);
  return raw;
}
function knobX(t) {
  if (t < 7.0) return X1;
  if (t < 7.5) return dragDisplay(t);
  const d0 = dragDisplay(7.5);
  return d0 + (X2 - d0) * sp(t - 7.5, P.snap);
}

/* ---- toggle knob -> liquid tab indicator: the two edges ride different springs ---- */
const KN = [
  { t: 6.0, L: 70,   R: 110, h: 40, c: WH },    // off (placed while hidden)
  { t: 8.0, L: 106,  R: 146, h: 40, c: WH },    // flips on
  { t: 8.5, L: -180, R: -60, h: 52, c: INK },   // becomes the Day indicator
  { t: 9.0, L: -60,  R: 60,  h: 52, c: INK },   // Week
];
const KEV = { L: [], R: [], h: [], c: [[], [], []], bw: [] };
KN.forEach((k, i) => {
  const prev = KN[(i + KN.length - 1) % KN.length];
  const right = (k.L + k.R) > (prev.L + prev.R);
  KEV.L.push([k.t, k.L, right ? P.trail : P.lead]);
  KEV.R.push([k.t, k.R, right ? P.lead : P.trail]);
  KEV.h.push([k.t, k.h]); KEV.bw.push([k.t, k.R - k.L]);
  [0, 1, 2].forEach(j => KEV.c[j].push([k.t, k.c[j], P.fast]));
});

/* =========================================================================
   Content: each state's inner layer, in world coordinates.
   ========================================================================= */
const C = [];
function content(id, cx, cy, w, h, html, render, start, end) {
  C.push({ id, cx, cy, w, h, html, render, start, end });
}
const T = (s, cls = '', style = '') => `<span class="${cls}" style="${style}">${s}</span>`;

content('button', 0, 0, 296, 64,
  `<div class="flex center" style="width:100%;height:100%;gap:10px;color:#fff;font-size:18px;font-weight:500;letter-spacing:-0.01em">
     <span>Start today’s quests</span>${icon('arrow', 18, '#fff')}</div>`, null);

content('loader', 0, 0, 64, 64,
  `<div class="flex center" style="width:100%;height:100%">
     <svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="11" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="1.75"/>
     <circle id="spin" cx="15" cy="15" r="11" fill="none" stroke="#fff" stroke-width="1.75" stroke-linecap="round" pathLength="100" stroke-dasharray="28 200" transform="rotate(0 15 15)"/></svg></div>`,
  (t, e) => {
    const lt = t - 0.5;
    const ang = -90 + lt * 620 + 140 * easeInOut(lt / 0.5);
    const len = 22 + 16 * Math.sin(lt * Math.PI * 2);
    e.spin.setAttribute('transform', `rotate(${ang.toFixed(3)} 15 15)`);
    e.spin.setAttribute('stroke-dasharray', `${len.toFixed(3)} 200`);
  });

content('check', 0, 0, 64, 64,
  `<div class="flex center" style="width:100%;height:100%">${drawCheck('chk1', 32, '#fff')}</div>`,
  (t, e) => { e.chk1.setAttribute('stroke-dashoffset', (1 - sp(t - 1.06, [16, 0.9])).toFixed(4)); });

content('xp', 0, 0, 148, 60,
  `<div class="flex center tnum" style="width:100%;height:100%;color:#fff;font-size:24px;font-weight:600;letter-spacing:-0.02em">
     <span>+</span>${roll('xpr', ['0', '1', '2', '3'], 30)}<span style="margin-left:6px">XP</span></div>`,
  (t, e) => { setRoll(e.xpr, 3 * sp(t - 1.56, P.roll), 30); });

content('island', 0, 0, 236, 52,
  `<div class="flex center" style="width:100%;height:100%;gap:10px;color:#fff;font-size:17px;font-weight:500;letter-spacing:-0.01em">
     ${icon('flame', 20, '#7C5CFA')}<span>7-day streak</span></div>`, null);

content('quest', 0, 0, 360, 108,
  `<div class="abs" id="qbox" style="left:22px;top:40px;width:28px;height:28px;border-radius:9px;box-sizing:border-box;border:1.75px solid rgb(205,201,195)">
     <div class="abs" style="left:3.25px;top:3.25px">${drawCheck('qchk', 18, '#fff')}</div></div>
   <div class="abs" style="left:66px;top:28px">
     <div style="position:relative;display:inline-block;font-size:19px;font-weight:600;letter-spacing:-0.015em;line-height:24px" id="qtitle">Bike 30 min
       <div class="abs" id="qstrike" style="left:0;top:12.5px;height:1.75px;border-radius:1px;width:0;background:#8A8782"></div></div>
     <div class="flex" style="gap:8px;margin-top:6px;font-size:13.5px">
       <span style="background:rgba(124,92,250,.11);color:#7C5CFA;font-weight:500;padding:0 9px;height:22px;line-height:22px;border-radius:11px">Health</span>
       <span class="gray">30 min</span></div></div>
   <div class="abs vio" style="right:22px;top:43px;font-size:15px;font-weight:600;letter-spacing:-0.01em">+10 XP</div>`,
  (t, e) => {
    const k = sp(t - 3.0, P.morph);
    const pb = 1 - 0.14 * press(t, 3.0);
    e.qbox.style.background = `rgba(124,92,250,${clamp(k, 0, 1).toFixed(4)})`;
    e.qbox.style.borderColor = rgb(mix(BOX, VI, clamp(k, 0, 1)));
    e.qbox.style.transform = `scale(${pb.toFixed(4)})`;
    e.qchk.setAttribute('stroke-dashoffset', (1 - sp(t - 3.05, [18, 0.9])).toFixed(4));
    e.qstrike.style.width = px(e._titleW * sp(t - 3.08, [15, 0.9]));
    e.qtitle.style.color = rgb(mix(INK, G2, clamp(sp(t - 3.04, P.morph), 0, 1)));
  });

content('xpbar', 0, 0, 400, 92,
  `<div class="abs flex" style="left:24px;top:20px;gap:6px;font-size:16px;font-weight:600;letter-spacing:-0.01em">
     <span>Level 4</span>${icon('arrow', 16, '#8A8782')}<span>5</span></div>
   <div class="abs tnum gray" style="right:24px;top:21px;font-size:14px;font-weight:500"><span id="xpn">660</span> / 1000 XP</div>
   <div class="abs" style="left:24px;right:24px;top:56px;height:10px;border-radius:5px;background:#EFECE8;overflow:hidden">
     <div id="xpf" style="height:100%;border-radius:5px;background:#7C5CFA;width:66%"></div></div>`,
  (t, e) => {
    const f = 0.66 + 0.34 * sp(t - 3.6, [10, 0.9]);
    e.xpf.style.width = `${(clamp(f, 0, 1) * 100).toFixed(3)}%`;
    e.xpn.textContent = Math.round(clamp(f, 0, 1) * 1000);
  });

content('mic', 0, 0, 88, 88,
  `<div class="flex center" style="width:100%;height:100%">${icon('mic', 30, '#fff')}</div>`, null);

const WAVE_N = 21;
content('rec', 0, 0, 288, 72,
  `<div class="abs" id="rdot" style="left:22px;top:31px;width:10px;height:10px;border-radius:5px;background:#7C5CFA"></div>
   <div class="abs flex" style="left:44px;top:0;height:72px;gap:3px">${Array.from({ length: WAVE_N }, (_, i) => `<div id="wv${i}" style="width:3px;height:4px;border-radius:1.5px;background:#fff"></div>`).join('')}</div>
   <div class="abs tnum w" style="left:178px;top:24px;font-size:18px;font-weight:500;line-height:24px">0:0${roll('tmr', ['0', '1', '2', '3'], 24)}</div>
   <div class="abs flex center" id="rstop" style="left:230px;top:14px;width:44px;height:44px;border-radius:22px;background:#2A2A2D">
     <div style="width:14px;height:14px;border-radius:3.5px;background:#fff"></div></div>`,
  (t, e) => {
    const amp = sp(t - 4.56, P.grow);
    for (let i = 0; i < WAVE_N; i++) {
      const a = Math.abs(Math.sin(t * 9.3 + i * 0.83)) * (0.55 + 0.45 * Math.sin(t * 3.7 + i * 1.31));
      const b = 0.5 + 0.5 * Math.sin(t * 13.1 - i * 0.57);
      const env = 0.35 + 0.65 * Math.pow(Math.abs(Math.sin(i * 0.52 + 0.4 + t * 1.3)), 1.5);
      const h = 4 + 28 * amp * env * clamp(0.18 + 0.6 * a + 0.35 * b * a, 0, 1);
      e['wv' + i].style.height = px(h);
    }

/* intervals from the keyframes */
const starts = KF.filter(k => k.id);
C.forEach(c => {
  if (c.start != null) return;
  const i = starts.findIndex(k => k.id === c.id);
  c.start = starts[i].t;

/* ---- build DOM ---- */
const $ = id => document.getElementById(id);
const stage = $('stage'), cam = $('cam'), shape = $('shape'), inner = $('inner'), cursor = $('cursor');

  const el = document.createElement('div');
  el.className = 'c';

  el.style.width = px(c.w); el.style.height = px(c.h);
  el.innerHTML = c.html;
  inner.appendChild(el);
  c.el = el;
  c.e = {};
  el.querySelectorAll('[id]').forEach(n => { c.e[n.id] = n; });
});
const byId = id => C.find(c => c.id === id);
function measure() {
  const q = byId('quest');
  q.el.style.display = 'block';
  q.e._titleW = q.e.qtitle.firstChild ? q.e.qtitle.getBoundingClientRect().width / 1 : 100;
  q.el.style.display = 'none';
  const ch = byId('chip'); ch.e._words = [...ch.el.querySelectorAll('.wd')];
  const p = byId('palette');
  p.el.style.display = 'block';
  p.e._tyW = [0, 1, 2].map(i => { const s = p.e['ty' + i]; s.style.width = 'auto'; const w = s.getBoundingClientRect().width; s.style.width = '0'; return w; });
  p.el.style.display = 'none';
}

/* content visibility: in = blur->sharp after the old one has mostly left */
function vis(t, c) {
  let best = null;
  for (const sh of [0, D, -D]) {
    const tt = t + sh;
    if (tt < c.start - 0.001 || tt > c.end + 0.2) continue;
    const ein = fin(tt, c.start + 0.075, 0.16);
    const eout = fout(tt, c.end, 0.12);
    const o = ein * (1 - eout);
    if (!best || o > best.o) best = { o, tt, ein, eout };
  }
  return best;
}

/* =========================================================================
   seek(t): pure
   ========================================================================= */
function seek(tIn) {
  let t = ((+tIn % D) + D) % D;
  if (!(t >= 0)) t = 0;

  // camera
  const cx = track(t, CEV.x, P.cam), cy = track(t, CEV.y, P.cam), s = Math.exp(track(t, CEV.s, P.cam));
  cam.style.transform = `translate(720px,720px) scale(${s.toFixed(5)}) translate(${px(-cx)},${px(-cy)})`;

  // the shape
  const w = track(t, EV.w, P.morph), h = track(t, EV.h, P.morph);
  const x = track(t, EV.x, P.morph), y = track(t, EV.y, P.morph);
  const rmax = Math.min(w, h) / 2;
  const rr = EV.r.map(ev => clamp(track(t, ev, P.morph), 0, rmax));
  const col = EV.c.map(ev => track(t, ev, P.morph));
  const pr = 1 - 0.035 * (press(t, 0.5) + press(t, 4.5));
  shape.style.left = px(x - w / 2); shape.style.top = px(y - h / 2);
  shape.style.width = px(w); shape.style.height = px(h);
  shape.style.borderRadius = rr.map(px).join(' ');
  shape.style.background = rgb(col);
  shape.style.transform = `scale(${pr.toFixed(5)})`;
  const whiteness = clamp((col[0] + col[1] + col[2]) / 765, 0, 1);
  // shadow is specified in screen px and divided by the zoom, so it never balloons into a halo
  const q = 1 / s;
  shape.style.boxShadow = `0 ${px(2 * q)} ${px(4 * q)} rgba(11,11,12,${(0.04 + 0.03 * whiteness).toFixed(4)}), 0 ${px(22 * q)} ${px(48 * q)} ${px(-14 * q)} rgba(11,11,12,${(0.10 + 0.06 * whiteness).toFixed(4)})`;
  inner.style.left = px(-(x - w / 2)); inner.style.top = px(-(y - h / 2));

  // contents
  for (const c of C) {
    const v = vis(t, c);
    if (!v || v.o <= 0.001) { c.el.style.display = 'none'; continue; }
    const el = c.el;
    el.style.display = 'block';
    el.style.opacity = v.o >= 0.999 ? '1' : v.o.toFixed(4);
    const blur = v.eout > 0 ? 6 * v.eout : 7 * (1 - v.ein);
    el.style.filter = blur > 0.02 ? `blur(${px(blur)})` : 'none';
    const sc = v.eout > 0 ? 1 + 0.015 * v.eout : 0.965 + 0.035 * v.ein;
    el.style.transform = Math.abs(sc - 1) > 1e-4 ? `scale(${sc.toFixed(5)})` : '';
    if (c.render) c.render(v.tt, c.e);
  }

  // knob / tab indicator
  {
    const L = track(t, KEV.L, P.morph), R = track(t, KEV.R, P.morph);
    const hb = track(t, KEV.h, P.morph), bw = track(t, KEV.bw, P.morph);
    const stretch = (R - L) - bw;
    const hh = hb * (1 - 0.1 * clamp(stretch / 40, -0.6, 1));
    const kc = KEV.c.map(ev => track(t, ev, P.morph));
    const kn = byId('knob').e.kn;
    kn.style.left = px(Math.min(L, R)); kn.style.top = px(-hh / 2);
    kn.style.width = px(Math.abs(R - L)); kn.style.height = px(hh);
    kn.style.borderRadius = px(hh / 2);
    kn.style.background = rgb(kc);
    const wk = clamp((kc[0] - 11) / 244, 0, 1);
    kn.style.boxShadow = `0 1px 3px rgba(11,11,12,${(0.2 * wk).toFixed(4)}), 0 3px 8px rgba(11,11,12,${(0.08 * wk).toFixed(4)})`;
    kn.style.transform = `scale(${(1 - 0.06 * press(t, 8.0)).toFixed(4)})`;
  }

  // cursor (screen space, glued to world)
  const wx = curX(t), wy = curY(t);
  const sx = 720 + (wx - cx) * s, sy = 720 + (wy - cy) * s;
  const cs = 1 - 0.16 * cursorPress(t);
  cursor.style.transform = `translate(${px(sx)},${px(sy)}) scale(${cs.toFixed(4)})`;
}

  await Promise.all([400, 500, 600].map(wt => document.fonts.load(`${wt} 20px Geist`)));

})();
